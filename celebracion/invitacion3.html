<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sara & Alfonso</title>

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />

<body>
  <page size="A5" class="two-rows">
    <div class="row-container h21 fondo-delicado">

        <div class="flex-column love love-side">

        </div>

        <div class="flex-column bg-novios paper-novios right-novios">

          <div class="front front-side">
            <div class="year year1">
              <div class="digit">2</div>
              <div class="digit">0</div>
              <div class="digit"> </div>
              <div class="digit">S</div>
              <div class="digit">E</div>
              <div class="digit">P</div>
              <div class="digit"> </div>
              <div class="digit">2</div>
              <div class="digit">0</div>
              <div class="digit">2</div>
              <div class="digit">5</div>
            </div>

            <div class="year year2">
              <div class="digit">2</div>
              <div class="digit">0</div>
              <div class="digit"> </div>
              <div class="digit">S</div>
              <div class="digit">E</div>
              <div class="digit">P</div>
              <div class="digit"> </div>
              <div class="digit">2</div>
              <div class="digit">0</div>
              <div class="digit">2</div>
              <div class="digit">5</div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </page>

  <page size="A5" class="two-rows">
    <div class="row-container h21">
      <div class="flex-row single-border sobre-papel">
        <h1 class="reverse">Nos encantaría que nos acompañaras en este día tan especial</h1>
      </div>
      <div class="flex-row column-container">
        <div class="flex-column">
          <div class="roque-mid roque-full">
          </div>
        </div>
        <div class="flex-column">
          <h1 class="brown">Parador de Tejeda, Gran Canaria</h1>
        </div>
      </div>
    </div>
  </page>
