<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sara & Alfonso</title>

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />

  <!-- style -->
  <link href="../css/style.css" rel="stylesheet" type="text/css" />
  <link href="../css/countdown.css" rel="stylesheet" type="text/css" />
  <link href="../css/paper.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <page size="A5" layout="landscape" class="four-column">
    <div class="column-container">
      <div class="column confetti"></div>
      <div class="double-column">
        <div class="flex-column love">
          <h1 class="love-font">aralfons</h1>
        </div>
        <div class="text-centered">
          <h1>Nos encantaría que nos acompañaras en este día tan especial</h1>
        </div>
        <div class="paper-footer">
        </div>
      </div>
      <div class="column confetti"></div>
    </div>
  </page>

  <page size="A5" layout="landscape" class="four-column">
    <div class="column-container">
      <div class="column">
        <div class="flex-column novio"></div>

        <div class="front">
          <div class="year year1">
            <div class="digit">2</div>
            <div class="digit">0</div>
            <div class="digit">2</div>
            <div class="digit">5</div>
          </div>

          <div class="year year2">
            <div class="digit">2</div>
            <div class="digit">0</div>
            <div class="digit">2</div>
            <div class="digit">5</div>
          </div>
        </div>

      </div>
      <div class="double-column">
        <div class="poring-footer">
        </div>
      </div>
      <div class="column">
        <div class="flex-column novia"></div>

        <div class="front">
          <div class="year year1">
            <div class="digit">2</div>
            <div class="digit">0</div>
            <div class="digit"> </div>
            <div class="digit">S</div>
            <div class="digit">E</div>
            <div class="digit">P</div>
          </div>

          <div class="year year2">
            <div class="digit">2</div>
            <div class="digit">0</div>
            <div class="digit"> </div>
            <div class="digit">S</div>
            <div class="digit">E</div>
            <div class="digit">P</div>
          </div>
        </div>
      </div>
    </div>
  </page>
</body>

</html>
